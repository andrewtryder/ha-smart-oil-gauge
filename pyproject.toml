[project]
name = "ha-smart-oil-gauge"
version = "0.0.0"
description = "Home Assistant custom integration for Smart Oil Gauge sensors"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "homeassistant==2026.10.4",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-socket>=0.7.0",
    "ruff==0.17.3",
    "pre-commit==4.6.2",
    "beautifulsoup4>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
addopts = "--cov=custom_components/smart_oil_gauge --cov-report=term-missing --cov-report=xml --cov-fail-under=96"
pythonpath = [
    ".",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "D",
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"
